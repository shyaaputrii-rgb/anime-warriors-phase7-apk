plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neonronin.animewarrior'
    compileSdk 34

    defaultConfig {
        applicationId 'com.neonronin.animewarrior'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Biar folder yang diawali underscore (contoh _next) dan file titik ikut masuk APK
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
